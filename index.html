<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shree Sendhav Dairy V34</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#172033}
header{background:#0757a5;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:white;box-shadow:0 2px 5px #bbb}
nav button{border:0;background:#0757a5;color:white;padding:10px 14px;border-radius:6px}
section{display:none;padding:15px;max-width:1200px;margin:auto}
section.active{display:block}
.card{background:white;padding:15px;margin-bottom:15px;border-radius:10px;box-shadow:0 2px 8px #ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
input,select,button{font-size:16px}
input,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:6px}
.btn{background:#087f23;color:white;border:0;padding:11px 16px;border-radius:6px;margin-top:10px}
.danger{background:#c62828}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#e8f0f8}
.total{font-size:20px;font-weight:bold;margin-top:12px}
.small{font-size:13px;color:#666}
</style>
</head>

<body>

<header>
<h1>🥛 Shree Sendhav Dairy V34</h1>
<p>Milk Purchase & Farmer Management System</p>
</header>

<button onclick="show('bill')">10-Day Bill</button>
<button onclick="show('product')">Products</button>
<button onclick="show('report')">Reports</button>
</nav>
